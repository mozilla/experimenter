[metrics.any_organic_content_clicks]
friendly_name = "Any organic Content Clicks"
description = """
Client had any Content clicks during the experiment.
"""
data_source = "newtab_clients_daily"
aggregation = "any"
cumulative_window = 7
repeat_windows = true

[[metrics.any_organic_content_clicks.where]]
column = "organic_content_click_count"
op = ">"
value = 0

[metrics.any_sponsored_tiles_dismissals]
friendly_name = "Any Sponsored Tiles Dismissed"
description = "Clients that dismissed any sponsored tiles"
data_source = "newtab_clients_daily"
aggregation = "any"
cumulative_window = 7
repeat_windows = true

[[metrics.any_sponsored_tiles_dismissals.where]]
column = "sponsored_topsite_dismissal_count"
op = ">"
value = 0

[metrics.newtab_ad_clicks]
friendly_name = "Newtab Ad Clicks"
description = """
Count of searches performed on the New Tab that resulted in an ad click
"""
data_source = "newtab_clients_daily"
aggregation = "sum"
column = "search_ad_click_count"
cumulative_window = 7
repeat_windows = true

[metrics.newtab_any_searches]
friendly_name = "Any Newtab Searches"
description = """
Client performed any Newtab Handoff searches during the experiment
"""
data_source = "newtab_clients_daily"
aggregation = "any"
cumulative_window = 7
repeat_windows = true

[[metrics.newtab_any_searches.where]]
column = "search_interaction_count"
op = ">"
value = 0

