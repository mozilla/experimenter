# Metrics supporting analyzing background notification experiments.

[metrics.notification_shown]
friendly_name = "Notification Shown"
description = "Number of times a user was shown a notification."
select_expression = """
    {{agg_any("event_name = 'message_shown'")}}
"""
data_source = "notification_messaging_events_stream"

[metrics.notification_clicked]
friendly_name = "Notification Clicked"
description = "Number of times a user clicked a notification."
select_expression = """
    {{agg_any("event_name = 'message_clicked'")}}
"""
data_source = "notification_messaging_events_stream"

[metrics.notification_dismissed]
friendly_name = "Notification Dismissed"
description = "Number of times a user dismissed a notification."
select_expression = """
    {{agg_any("event_name = 'message_dismissed'")}}
"""
data_source = "notification_messaging_events_stream"

[data_sources.notification_messaging_events_stream]
from_expression = """(
    SELECT *, DATE(submission_timestamp) AS submission_date
    FROM `moz-fx-data-shared-prod.fenix.events_stream`
    WHERE event_category IN ('messaging')
    AND event_name IN ('message_shown', 'message_dismissed', 'message_clicked')
    -- Like 'all-users-day-5-reengagement-push-2-ai-controls:%'.
    AND STARTS_WITH(extras.string.message_key,
      CASE
        -- An unfortunate wart from an early experiment.
        WHEN '{{experiment.normandy_slug}}' = 'all-users-day-5-reengagement-push' THEN 'privacy-value'
        ELSE '{{experiment.normandy_slug}}:'
      END)
)"""
description = "Glean events_stream dataset (events ping unnested to a single row per event) filtered"
friendly_name = "Glean Events Stream Filtered"
experiments_column_type = "none"
client_id_column = "client_id"

# For context: be aware that metrics pings are not reliably sent for
# users who don't run Firefox for Android to browse, so we need to be
# defensive.  We care about users who we witnessed disabling
# notifications in response to the experiment.  Remember that the
# notification worker is only scheduled for users who (at one time,
# see https://bugzilla.mozilla.org/show_bug.cgi?id=2048113) had the
# notification permission allowed.

[metrics.ever_not_notifications_allowed]
friendly_name = "Were Notifications Ever Not Allowed"
description = "Whether notifications were definitely not allowed at least once in the given period."
select_expression = """
    COALESCE(LOGICAL_OR(NOT notifications_allowed), FALSE)
"""
data_source = "metrics_clients_daily"

[metrics.ever_not_marketing_notifications_allowed]
friendly_name = "Were Marketing Notifications Ever Not Allowed"
description = "Whether marketing notifications were definitely not allowed at any time in the given period."
select_expression = """
    COALESCE(LOGICAL_OR(NOT marketing_notifications_allowed), FALSE)
"""
data_source = "metrics_clients_daily"

