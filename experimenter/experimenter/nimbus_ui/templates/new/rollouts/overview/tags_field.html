<div id="overview-tags-field"
     class="d-flex flex-wrap align-items-center gap-1"
     hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% for tag in experiment.tags.all %}
    <span class="badge rounded-pill d-inline-flex align-items-center gap-1"
          style="background-color: {{ tag.color }};
                 color: white">
      {{ tag.name }}
      <button type="button"
              class="p-0 border-0 bg-transparent text-white lh-1"
              aria-label="Remove {{ tag.name }}"
              hx-post="{% url 'nimbus-ui-new-remove-tag' experiment.slug %}"
              hx-vals='{"tag_id": "{{ tag.id }}"}'
              hx-target="#overview-tags-field"
              hx-swap="outerHTML">
        <i class="fa-solid fa-xmark fa-xs"></i>
      </button>
    </span>
  {% endfor %}
  <div class="dropdown d-flex">
    <button id="add-tag-button"
            type="button"
            class="badge rounded-pill border border-secondary bg-transparent text-secondary"
            data-bs-toggle="dropdown"
            data-bs-auto-close="outside"
            aria-expanded="false"
            aria-label="Add tag"
            hx-get="{% url 'nimbus-ui-new-search-tags' experiment.slug %}"
            hx-target="#tag-search-results"
            hx-swap="innerHTML">
      <i class="fa-solid fa-plus" data-bs-toggle="tooltip" title="Add tag"></i>
    </button>
    <div class="dropdown-menu p-2" style="width: 18rem">
      <input type="text"
             class="form-control form-control-sm mb-2"
             placeholder="Search existing tags or features"
             autocomplete="off"
             name="q"
             hx-get="{% url 'nimbus-ui-new-search-tags' experiment.slug %}"
             hx-trigger="input changed delay:300ms"
             hx-target="#tag-search-results"
             hx-swap="innerHTML">
      <div id="tag-search-results"></div>
    </div>
  </div>
</div>
