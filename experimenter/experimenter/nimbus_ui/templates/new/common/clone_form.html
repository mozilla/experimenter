<div class="d-flex flex-column gap-3">
  {% csrf_token %}
  <div>
    <label for="{{ form_id_prefix }}-name" class="small text-body mb-1">Public Name</label>
    <input type="text"
           id="{{ form_id_prefix }}-name"
           name="name"
           value="{{ form.name.value }}{% if not form.is_bound %}{% if branch_slug %} - {{ branch_slug }} Rollout{% else %} Copy{% endif %}{% endif %}"
           class="form-control{% if form.name.errors %} is-invalid{% endif %}" />
    {% for error in form.name.errors %}<div class="invalid-feedback">{{ error }}</div>{% endfor %}
    <p class="form-text mb-0 mt-1">This name will be public to users in about:studies.</p>
  </div>
  <div class="d-flex align-items-center justify-content-end gap-2">
    <button type="button"
            class="btn btn-outline-secondary btn-sm"
            data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary btn-sm">Save</button>
  </div>
</div>
