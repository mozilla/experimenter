version: 2
updates:
  - package-ecosystem: npm
    directory: "/experimenter"
    schedule:
      interval: weekly
    target-branch: main
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-major", "version-update:semver-patch"]
      - dependency-name: "vega"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: uv
    directory: "/experimenter"
    schedule:
      interval: weekly
    target-branch: main
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-major", "version-update:semver-patch"]
  - package-ecosystem: uv
    directory: "/experimenter/tests"
    schedule:
      interval: weekly
    target-branch: main
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-major", "version-update:semver-patch"]
  - package-ecosystem: uv
    directory: "/cirrus/server"
    schedule:
      interval: weekly
    target-branch: main
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-major", "version-update:semver-patch"]
  - package-ecosystem: uv
